<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Chat App</title>
        <link rel="icon" href="/images/favicon.png">
        <link rel="stylesheet" href="./css/styles.css">
    </head>
    <body>
        <div class="chat">
            <div id="sidebar" class="chat__sidebar">

            </div>

            <div class="chat__main">
                <div id="messages" class="chat__messages"></div>

                <div class="compose">
                    <form id="message-form">
                        <input name="message" placeholder="Enter text" required autocomplete="off"/>
                        <button>Submit</button>
    
                        <button id="send-location">Share your location</button>
                    </form>
                </div> 
            </div>
        </div>

        <script id="message-template" type="text/html">
            <div class="message">
                <p>
                    <span class="message__name">{{username}}</span>
                    <span class="message__meta">{{createdAt}}</span>
                </p>
                <p>{{message}}</p>
            </div>
        </script>

        <script id="location-template" type="text/html">
            <div class="message">
                <p>
                    <span class="message__name">{{username}}</span>
                    <span class="message__meta">{{createdAt}}</span>
                </p>
                <p><a href="{{url}}" target="_blank"> My current location</a></p>
            </div>
        </script>
        
        <script id="sidebar-template" type="text/html">
            <div class="nav-chat">
                <a href="/chatroom.html"><img src="/images/back-img.png" alt=""></a>
                <h2 class="room-title"><span>Room:</span> <br> {{room}}</h2>
            </div>
            <h3 class="list-title">Users:</h3>
            <ul class="users">
                <!-- used to render a array -->
                {{#users}}
                    <li>{{username}}</li>
                {{/users}}
            </ul>
        </script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/4.1.0/mustache.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.11.0/qs.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/js/chat.js"></script>
    </body>
</html>
