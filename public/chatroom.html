<!doctype html>
<html lang="en" class="bg-[#0f0f10] text-[#e4e4e7] min-h-screen">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chatly | Join Room</title>
        <link rel="stylesheet" href="/css/styles.css" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
            body { font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }

            .input-premium {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .input-premium:focus {
                border-color: rgba(255, 255, 255, 0.3);
                background: rgba(255, 255, 255, 0.05);
                outline: none;
            }

            .fade-in {
                animation: fadeIn 0.8s ease-out forwards;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
    </head>
    <body class="antialiased flex items-center justify-center min-h-screen p-6 relative">
    
    <a href="/index.html" class="absolute top-10 left-10 group flex items-center gap-2 text-xs font-medium uppercase tracking-[0.2em] text-gray-500 hover:text-white transition-colors">
        <svg class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back
    </a>

    <div class="w-full max-w-[400px] fade-in py-12">
        <header class="flex flex-col items-center gap-3 mb-10">
            <img src="/images/favicon.png" class="h-10"/>
            <h1 class="text-3xl font-medium tracking-tight text-white">Access Chatly</h1>
            <p class="text-gray-500 text-sm font-light">Enter your credentials to begin session.</p>
        </header>
        
        <form action="/chat.html" class="flex flex-col gap-5">
            <div class="space-y-2">
                <label class="text-[10px] uppercase tracking-[0.2em] text-gray-500 ml-1">Username</label>
                <input 
                    type="text" 
                    name="username"
                    id="username"
                    placeholder="e.g. Maverick" 
                    required 
                    class="input-premium w-full py-4 px-5 rounded-2xl text-white placeholder:text-gray-400"
                />
            </div>

            <div class="space-y-2">
                <label class="text-[10px] uppercase tracking-[0.2em] text-gray-500 ml-1">Room ID</label>
                <input 
                    type="text" 
                    name="room"
                    id="room"
                    placeholder="e.g. Operations" 
                    required 
                    class="input-premium w-full py-4 px-5 rounded-2xl text-white placeholder:text-gray-400"
                />
            </div>

            <button type="submit" class="w-full py-4 mt-4 bg-white text-black font-semibold rounded-2xl hover:bg-gray-200 active:scale-[0.97] transition-all duration-300 shadow-xl shadow-white/5">
                Connect
            </button>
        </form>

        <footer class="mt-16 text-center">
            <p class="text-[10px] text-gray-700 uppercase tracking-[0.3em]">
                Secure Channel • End-to-End
            </p>
        </footer>
    </div>
</body>
</html>
